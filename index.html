    <script id="js-vertex-shader" type="x-shader/x-vertex">
        attribute vec3 position;
        void main() {
            gl_Position = vec4(position, 1.0);
        }
    </script>

    <script id="js-fragment-shader" type="x-shader/x-fragment">
        precision highp float;
        uniform vec2 resolution;
        uniform float time;
        uniform float xScale;
        uniform float yScale;
        uniform float distortion;
        uniform vec2 mouse;

        void main() {
            vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
            float d = length(p - (mouse - 0.5)) * (distortion * 2.0);
            
            float rx = p.x * (1.0 + d);
            float gx = p.x;
            float bx = p.x * (1.0 - d);

            float r = 0.05 / abs(p.y + sin((rx + time) * xScale) * (yScale + mouse.y * 0.2));
            float g = 0.05 / abs(p.y + sin((gx + time) * xScale) * yScale);
            float b = 0.05 / abs(p.y + sin((bx + time) * xScale) * (yScale + mouse.x * 0.2));
            
            gl_FragColor = vec4(r, g, b, 1.0);
        }
    </script>

    <script>
        class Stage {
            constructor() {
                this.renderParam = { clearColor: 0x06100a, width: window.innerWidth, height: window.innerHeight };
                this.cameraParam = { left: -1, right: 1, top: 1, bottom: -1, near: 0, far: -1 };
                this.scene = null;
                this.camera = null;
                this.renderer = null;
            }
            init() {
                this.scene = new THREE.Scene();
                this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("webgl-canvas"), antialias: true });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setClearColor(new THREE.Color(this.renderParam.clearColor));
                this.renderer.setSize(this.renderParam.width, this.renderParam.height);
                this.camera = new THREE.OrthographicCamera(this.cameraParam.left, this.cameraParam.right, this.cameraParam.top, this.cameraParam.bottom, this.cameraParam.near, this.cameraParam.far);
            }
            onResize() { this.renderer.setSize(window.innerWidth, window.innerHeight); }
            onRaf() { this.renderer.render(this.scene, this.camera); }
        }

        class Mesh {
            constructor(stage) {
                this.stage = stage;
                this.mouse = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5 };
                this.uniforms = {
                    resolution: { type: "v2", value: [window.innerWidth, window.innerHeight] },
                    time: { type: "f", value: 0.0 },
                    xScale: { type: "f", value: 1.0 },
                    yScale: { type: "f", value: 0.5 },
                    distortion: { type: "f", value: 0.050 },
                    mouse: { type: "v2", value: [0.5, 0.5] }
                };
            }
            init() {
                const position = [-1.0, -1.0, 0.0, 1.0, -1.0, 0.0, -1.0, 1.0, 0.0, 1.0, -1.0, 0.0, -1.0, 1.0, 0.0, 1.0, 1.0, 0.0];
                const positions = new THREE.BufferAttribute(new Float32Array(position), 3);
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute("position", positions);
                const material = new THREE.RawShaderMaterial({
                    vertexShader: document.getElementById("js-vertex-shader").textContent,
                    fragmentShader: document.getElementById("js-fragment-shader").textContent,
                    uniforms: this.uniforms,
                    side: THREE.DoubleSide
                });
                this.mesh = new THREE.Mesh(geometry, material);
                this.stage.scene.add(this.mesh);

                window.addEventListener("mousemove", (e) => {
                    this.mouse.targetX = e.clientX / window.innerWidth;
                    this.mouse.targetY = 1.0 - (e.clientY / window.innerHeight);
                });
            }
            onRaf() {
                this.uniforms.time.value += 0.015;
                this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.05;
                this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.05;
                this.uniforms.mouse.value = [this.mouse.x, this.mouse.y];
            }
        }

        function renderData(list) {
            const container = document.getElementById("results-list");
            container.innerHTML = "";
            if(list.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#f87171;'>কোনো এনচ্যান্টমেন্ট পাওয়া যায়নি!</p>";
                return;
            }
            list.forEach((item, index) => {
                const badgesHtml = item.items.map(i => `<span class="badge">🎯 ${i}</span>`).join('');
                const div = document.createElement("div");
                div.className = "card";
                div.style.animationDelay = `${index * 0.03}s`;
                div.innerHTML = `
                    <div class="card-header">
                        <div class="icon-box"><img src="${item.icon}" alt="${item.name}"></div>
                        <h3>${item.name}</h3>
                    </div>
                    <div class="badge-container">${badgesHtml}</div>
                    <p>${item.desc}</p>
                    <p class="max-lvl">⭐ ${item.max}</p>
                `;
                container.appendChild(div);
            });
        }

        function filterByItem(itemName, event) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
            if(itemName === 'All') {
                renderData(enchantments);
            } else {
                const filtered = enchantments.filter(e => e.items.includes(itemName) || e.items.includes("All Gear & Tools"));
                renderData(filtered);
            }
        }

        function searchData() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = enchantments.filter(e => 
                e.name.toLowerCase().includes(query) || 
                e.desc.toLowerCase().includes(query) || 
                e.items.some(i => i.toLowerCase().includes(query))
            );
            renderData(filtered);
        }

        const stage = new Stage();
        stage.init();
        const mesh = new Mesh(stage);
        mesh.init();

        window.addEventListener('resize', () => {
            stage.onResize();
        });

        function animate() {
            requestAnimationFrame(animate);
            mesh.onRaf();
            stage.onRaf();
        }
        animate();
    </script>
